# PR 與 main 的自動檢查：lint、型別、靜態建置、冒煙測試。
# 只用 GitHub 官方 actions；pnpm 版本跟 package.json 的 packageManager 一致。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # package.json 有 packageManager 時 v5 會自動開 pnpm 快取，但 pnpm 下一步才安裝
          package-manager-cache: false

      - name: Install pnpm
        run: npm i -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (static generate)
        run: pnpm generate

      - name: Smoke test
        run: pnpm test:smoke
