# pnpm 設定（單一專案也放這裡，不需要 packages:）。決策紀錄見 docs/package-manager.md

# Node 版本不符合 package.json 的 engines（>=26 <27）就拒絕安裝。
# 原本寫在 .npmrc 的 engine-strict=true，pnpm 不會讀，要寫在這裡。
engineStrict: true

# 新版本發布未滿 24 小時（1440 分鐘）不安裝。明確寫出來才是嚴格模式：
# 沒有夠舊的版本時直接失敗，而不是退而安裝新版本。
minimumReleaseAge: 1440

# 套件的信任等級比之前的版本低（例如原本有來源證明、新版沒有）就拒絕安裝。
trustPolicy: no-downgrade
trustPolicyExclude:
  # 同一位維護者 2.5.0 用 CI 發布（有來源證明），30 分鐘後手動發布 3.0.0-pre1（沒有）。
  # 經由 @vite-pwa/nuxt → workbox-build 引入。只排除這一個版本，之後的版本照常檢查。
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"

# 允許執行安裝腳本的套件，沒列出的一律不執行
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  vue-router: 5.4.0

# @nuxtjs/mdc 是 @nuxt/content 的間接依賴。Nuxt 會叫 Vite 預先打包 `@nuxtjs/mdc > remark-gfm` 等套件，
# Vite 要從專案根目錄找得到 @nuxtjs/mdc 才行；pnpm 預設不會把間接依賴放到根目錄，
# 開發伺服器就會出現 NUXT_B7002 警告。把它提升到根目錄的 node_modules。
publicHoistPattern:
  - "@nuxtjs/mdc"
